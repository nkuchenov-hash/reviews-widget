name: Apply API config loader
on:
  push:
    paths:
      - '.github/workflows/apply-api-config.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add API config before builder
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script>\n(function(){\n  const v = Date.now();'
          if 'api-config.js' not in s:
              s=s.replace(marker,'<script src="api-config.js?v=20260925"></script>\n'+marker)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit API config loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load backend API config"
          git push
