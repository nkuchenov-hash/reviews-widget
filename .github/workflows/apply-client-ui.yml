name: Apply client UI
on:
  push:
    paths:
      - '.github/workflows/apply-client-ui.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply client shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Universal Reviews — Widget Builder</title>','<title>Виджет отзывов</title>')
          if 'client.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="client.css?v=20260925-client1">\n</head>')
          if 'client-ui.js' not in s:
              s=s.replace('</body>','<script src="client-ui.js?v=20260925-client1"></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Enable client-facing widget builder' || true
          git push
