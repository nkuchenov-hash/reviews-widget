name: Apply subscription page
on:
  push:
    paths:
      - '.github/workflows/apply-subscription-page.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add subscription section to account
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js'); s=p.read_text(encoding='utf-8')
          old='<nav class="nav"><button data-go="projects" class="${active===\'projects\'?\'on\':\'\'}">Мои проекты</button><button data-go="account" class="${active===\'account\'?\'on\':\'\'}">Аккаунт</button></nav>'
          new='<nav class="nav"><button data-go="projects" class="${active===\'projects\'?\'on\':\'\'}">Мои проекты</button><button data-go="subscription" class="${active===\'subscription\'?\'on\':\'\'}">Подписка</button><button data-go="account" class="${active===\'account\'?\'on\':\'\'}">Аккаунт</button></nav>'
          assert old in s
          s=s.replace(old,new,1)
          marker='function tabs(id,on){'
          assert marker in s
          subscription="""function subscriptionPage(){return shell(`<div class=\"topbar\"><div><div class=\"eyebrow\">Тариф и оплата</div><h1 class=\"page-title\">Подписка</h1></div><span class=\"status live\">Beta</span></div><section class=\"panel\"><h3>Текущий тариф</h3><div class=\"settings-grid\"><div class=\"notice good\"><b>Beta · 0 ₽</b><br>Тестовый доступ активен. Карта не требуется.</div><div class=\"notice\"><b>Лимит сейчас не применяется.</b><br>ETNIKA и локальные тестовые проекты можно использовать во время беты.</div></div><button class=\"btn dark\" disabled>Оплата откроется перед публичным запуском</button></section><section class=\"panel\" style=\"margin-top:16px\"><h3>Как будет работать оплата</h3><div class=\"notice\">Оплата подписки будет приниматься через российский платёжный сервис: российская банковская карта и/или СБП. Точный провайдер подключим вместе с серверной частью, чтобы платежи, тариф и доступ к проектам управлялись автоматически.</div></section><section class=\"panel\" style=\"margin-top:16px\"><h3>История платежей</h3><div class=\"notice\">Платежей пока нет — действует бесплатный Beta-доступ.</div></section>`,'subscription')}
"""
          s=s.replace(marker,subscription+marker,1)
          old_render="if(r.page==='account'){root.innerHTML=accountPage();bindAccount();return}"
          new_render="if(r.page==='subscription'){root.innerHTML=subscriptionPage();bindShell();return}if(r.page==='account'){root.innerHTML=accountPage();bindAccount();return}"
          assert old_render in s
          s=s.replace(old_render,new_render,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit subscription page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Add subscription section to account"
          git push
