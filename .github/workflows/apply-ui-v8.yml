name: Apply UI v8 patch

on:
  push:
    paths:
      - '.github/workflows/apply-ui-v8.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_ui_v8.py
      - name: Remove one-time patch files
        run: rm -f scripts/patch_ui_v8.py .github/workflows/apply-ui-v8.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Make layout settings contextual and add font weights"
          git push
