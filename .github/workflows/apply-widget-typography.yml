name: Apply widget typography controls
on:
  push:
    paths:
      - '.github/workflows/apply-widget-typography.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add granular typography and enforce 16px minimum
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          # widget.js
          p=Path('widget.js'); s=p.read_text(encoding='utf-8')
          old="fontFamily:'inherit',titleFontFamily:'inherit',fontCssUrl:'',titleSize:38,bodySize:15,mobileTitleSize:30,bodyWeight:400,titleWeight:500,strongWeight:500,"
          new="fontFamily:'inherit',titleFontFamily:'inherit',fontCssUrl:'',titleSize:38,mobileTitleSize:30,bodySize:16,kickerSize:16,summarySize:16,authorSize:16,metaSize:16,ratingSize:16,buttonSize:16,actionSize:16,responseSize:16,bodyWeight:400,titleWeight:500,strongWeight:500,"
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('--u-body-size:15px;','--u-body-size:16px;--u-kicker-size:16px;--u-summary-size:16px;--u-author-size:16px;--u-meta-size:16px;--u-rating-size:16px;--u-button-size:16px;--u-action-size:16px;--u-response-size:16px;',1)
          reps={
            '.urw-kicker{font-size:13px;':'.urw-kicker{font-size:var(--u-kicker-size);',
            'margin-top:8px;font-size:13px;color:var(--u-muted)': 'margin-top:8px;font-size:var(--u-summary-size);color:var(--u-muted)',
            '.urw-score{font-weight:700;color:var(--u-text);font-size:16px}':'.urw-score{font-weight:700;color:var(--u-text);font-size:var(--u-summary-size)}',
            'border-radius:var(--u-button-radius);font-size:13px;font-weight:var(--u-strong-weight)': 'border-radius:var(--u-button-radius);font-size:var(--u-button-size);font-weight:var(--u-strong-weight)',
            'place-items:center;font-size:12px;font-weight:700;': 'place-items:center;font-size:var(--u-meta-size);font-weight:700;',
            '.urw-author{font-weight:var(--u-strong-weight);font-size:14px;':'.urw-author{font-weight:var(--u-strong-weight);font-size:var(--u-author-size);',
            '.urw-meta{font-size:12px;':'.urw-meta{font-size:var(--u-meta-size);',
            '.urw-rating{margin:9px 0 7px;font-size:15px}':'.urw-rating{margin:9px 0 7px;font-size:var(--u-rating-size)}',
            'font:var(--u-strong-weight) 12px var(--u-font);':'font:var(--u-strong-weight) var(--u-action-size) var(--u-font);',
            '.urw-source{font-size:11px;':'.urw-source{font-size:var(--u-action-size);',
            'list-style:none;font-size:12px;font-weight:var(--u-strong-weight);':'list-style:none;font-size:var(--u-action-size);font-weight:var(--u-strong-weight);',
            '.urw-response-title{font-size:12px;':'.urw-response-title{font-size:var(--u-response-size);',
            '.urw-response-date{font-size:11px;':'.urw-response-date{font-size:var(--u-meta-size);',
            '.urw-response-text{font-size:13px;':'.urw-response-text{font-size:var(--u-response-size);',
            '.urw-reactions{display:flex;gap:14px;font-size:12px;':'.urw-reactions{display:flex;gap:14px;font-size:var(--u-action-size);',
            '.urw-original{font-size:12px;':'.urw-original{font-size:var(--u-action-size);',
            'font:var(--u-strong-weight) 13px var(--u-font);':'font:var(--u-strong-weight) var(--u-button-size) var(--u-font);',
            '.urw-yandex-credit{display:block;text-align:center;color:var(--u-muted);font-size:10px;':'.urw-yandex-credit{display:block;text-align:center;color:var(--u-muted);font-size:var(--u-action-size);',
            '.urw-live{font-size:12px;':'.urw-live{font-size:var(--u-action-size);'
          }
          for a,b in reps.items():
            if a in s: s=s.replace(a,b)
          old_apply="s.setProperty('--u-title-size',`${Math.max(18,Number(d.titleSize)||38)}px`);s.setProperty('--u-mobile-title-size',`${Math.max(18,Number(d.mobileTitleSize)||30)}px`);s.setProperty('--u-body-size',`${Math.max(12,Number(d.bodySize)||15)}px`);"
          new_apply="s.setProperty('--u-title-size',`${Math.max(18,Number(d.titleSize)||38)}px`);s.setProperty('--u-mobile-title-size',`${Math.max(18,Number(d.mobileTitleSize)||30)}px`);s.setProperty('--u-body-size',`${Math.max(16,Number(d.bodySize)||16)}px`);s.setProperty('--u-kicker-size',`${Math.max(16,Number(d.kickerSize)||16)}px`);s.setProperty('--u-summary-size',`${Math.max(16,Number(d.summarySize)||16)}px`);s.setProperty('--u-author-size',`${Math.max(16,Number(d.authorSize)||16)}px`);s.setProperty('--u-meta-size',`${Math.max(16,Number(d.metaSize)||16)}px`);s.setProperty('--u-rating-size',`${Math.max(16,Number(d.ratingSize)||16)}px`);s.setProperty('--u-button-size',`${Math.max(16,Number(d.buttonSize)||16)}px`);s.setProperty('--u-action-size',`${Math.max(16,Number(d.actionSize)||16)}px`);s.setProperty('--u-response-size',`${Math.max(16,Number(d.responseSize)||16)}px`);"
          assert old_apply in s
          s=s.replace(old_apply,new_apply,1)
          # Any remaining explicit text size below 16 in widget renderer is raised to 16.
          s=re.sub(r'font-size:(\d+)px',lambda m:f"font-size:{max(16,int(m.group(1)))}px",s)
          p.write_text(s,encoding='utf-8')

          # builder.js
          p=Path('builder.js'); s=p.read_text(encoding='utf-8')
          old="fontFamily:'inherit',titleFontFamily:'inherit',fontCssUrl:'',titleSize:38,mobileTitleSize:30,bodySize:15,bodyWeight:400,titleWeight:500,strongWeight:500,"
          new="fontFamily:'inherit',titleFontFamily:'inherit',fontCssUrl:'',titleSize:38,mobileTitleSize:30,bodySize:16,kickerSize:16,summarySize:16,authorSize:16,metaSize:16,ratingSize:16,buttonSize:16,actionSize:16,responseSize:16,bodyWeight:400,titleWeight:500,strongWeight:500,"
          assert old in s
          s=s.replace(old,new,1)
          old_keys="'titleSize','mobileTitleSize','bodySize','bodyWeight'"
          new_keys="'titleSize','mobileTitleSize','bodySize','kickerSize','summarySize','authorSize','metaSize','ratingSize','buttonSize','actionSize','responseSize','bodyWeight'"
          assert old_keys in s
          s=s.replace(old_keys,new_keys,1)
          marker="const boolKeys="
          assert marker in s
          s=s.replace(marker,"const typeSizeKeys=['bodySize','kickerSize','summarySize','authorSize','metaSize','ratingSize','buttonSize','actionSize','responseSize'];\n"+marker,1)
          marker="const layout=$('layout').value;"
          assert marker in s
          s=s.replace(marker,"typeSizeKeys.forEach(k=>d[k]=Math.max(16,Number(d[k])||defaults.design[k]||16));const layout=$('layout').value;",1)
          old_fill="function fill(){const s={...defaults.source,...(data.source||{})},d={...defaults.design,...(data.design||{})},c={...defaults.content,...(data.content||{})};"
          new_fill="function fill(){const s={...defaults.source,...(data.source||{})},d={...defaults.design,...(data.design||{})},c={...defaults.content,...(data.content||{})};typeSizeKeys.forEach(k=>d[k]=Math.max(16,Number(d[k])||defaults.design[k]||16));"
          assert old_fill in s
          s=s.replace(old_fill,new_fill,1)
          p.write_text(s,encoding='utf-8')

          # builder.html typography controls
          p=Path('builder.html'); s=p.read_text(encoding='utf-8')
          old='<div class="field"><label>Размер текста отзыва</label><input id="bodySize" type="number" min="12" max="28"></div>'
          assert old in s
          new='''<div class="field"><label>Текст отзыва</label><input id="bodySize" type="number" min="16" max="32"></div>
        <div class="row"><div class="field"><label>Подзаголовок / источник</label><input id="kickerSize" type="number" min="16" max="32"></div><div class="field"><label>Сводка рейтинга</label><input id="summarySize" type="number" min="16" max="32"></div></div>
        <div class="row"><div class="field"><label>Имя автора</label><input id="authorSize" type="number" min="16" max="32"></div><div class="field"><label>Дата и метаданные</label><input id="metaSize" type="number" min="16" max="32"></div></div>
        <div class="row"><div class="field"><label>Звёзды / рейтинг</label><input id="ratingSize" type="number" min="16" max="36"></div><div class="field"><label>Кнопки</label><input id="buttonSize" type="number" min="16" max="32"></div></div>
        <div class="row"><div class="field"><label>Ссылки и реакции</label><input id="actionSize" type="number" min="16" max="32"></div><div class="field"><label>Ответ организации</label><input id="responseSize" type="number" min="16" max="32"></div></div>'''
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # ETNIKA config gets explicit typography values.
          p=Path('projects/etnika.json'); j=json.loads(p.read_text(encoding='utf-8'))
          d=j.setdefault('design',{})
          for k in ['bodySize','kickerSize','summarySize','authorSize','metaSize','ratingSize','buttonSize','actionSize','responseSize']:
            d[k]=max(16,int(d.get(k,16) or 16))
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # No service UI text below 16px.
          for name in ['landing.css','app.css','builder.css','client.css']:
            p=Path(name); s=p.read_text(encoding='utf-8')
            s=re.sub(r'font-size:(\d+)px',lambda m:f"font-size:{max(16,int(m.group(1)))}px",s)
            def fix_font(m):
              n=int(m.group(2)); return 'font:'+m.group(1)+str(max(16,n))+'px'
            s=re.sub(r'font:([^;{}]*?)(\d+)px',fix_font,s)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Commit typography controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add widget.js builder.js builder.html projects/etnika.json landing.css app.css builder.css client.css
          git commit -m "Add granular widget typography controls"
          git push
