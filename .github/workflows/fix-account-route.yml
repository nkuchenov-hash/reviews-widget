name: Fix account route
on:
  push:
    paths:
      - '.github/workflows/fix-account-route.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix project route parsing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old="function route(){const h=location.hash.replace(/^#/,'')||'projects';const [a,b]=h.split('/');return {page:a,id:b}}"
          new="function route(){const h=location.hash.replace(/^#/,'')||'projects';const path=h.split('?')[0];const [a,b]=path.split('/');return {page:a,id:b}}"
          if old not in s:
              raise SystemExit('route pattern not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Fix account project tab routing"
          git push
