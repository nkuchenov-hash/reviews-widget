name: Fix fonts full range
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fonts and weights
        shell: python
        run: |
          from pathlib import Path

          # builder.js
          p=Path('builder.js')
          s=p.read_text(encoding='utf-8')
          old="const GOOGLE_FONTS='https://fonts.googleapis.com/css2?family=Forum&family=Geologica:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap';"
          new="const GOOGLE_FONTS='https://fonts.googleapis.com/css2?family=Forum&family=Geologica:wght@100;200;300;400;500;600;700;800;900&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap';"
          assert old in s, 'google fonts const not found'
          s=s.replace(old,new,1)

          old="d.fontFamily=familyFromControls('font');d.titleFontFamily=familyFromControls('titleFont');d.fontCssUrl=$('fontCssUrl').value.trim();"
          new="d.fontFamily=familyFromControls('font');d.titleFontFamily=familyFromControls('titleFont');d.fontCssUrl=$('fontCssUrl').value.trim();const fp=$('fontPreset').value,tp=$('titleFontPreset').value;if(!d.fontCssUrl&&(['geologica','inter'].includes(fp)||['forum','geologica','inter'].includes(tp)))d.fontCssUrl=GOOGLE_FONTS;"
          assert old in s, 'font collect marker not found'
          s=s.replace(old,new,1)

          # index.html weight options
          p2=Path('index.html')
          h=p2.read_text(encoding='utf-8')
          old='<option value="300">300 Light</option><option value="400">400 Regular</option><option value="500">500 Medium</option><option value="600">600 SemiBold</option><option value="700">700 Bold</option>'
          new='<option value="100">100 Thin</option><option value="200">200 ExtraLight</option><option value="300">300 Light</option><option value="400">400 Regular</option><option value="500">500 Medium</option><option value="600">600 SemiBold</option><option value="700">700 Bold</option><option value="800">800 ExtraBold</option><option value="900">900 Black</option>'
          count=h.count(old)
          assert count==3, f'expected 3 weight selects, found {count}'
          h=h.replace(old,new)

          # widget.js: wait for stylesheet load + font readiness before final render
          p3=Path('widget.js')
          w=p3.read_text(encoding='utf-8')
          old="function ensureFont(url){\n  if(!url)return;\n  const key='urw-font-'+btoa(unescape(encodeURIComponent(url))).replace(/[^a-z0-9]/gi,'').slice(-18);\n  if(document.getElementById(key))return;\n  const l=document.createElement('link');l.id=key;l.rel='stylesheet';l.href=url;document.head.appendChild(l)\n}"
          new="function ensureFont(url){\n  if(!url)return Promise.resolve();\n  const key='urw-font-'+btoa(unescape(encodeURIComponent(url))).replace(/[^a-z0-9]/gi,'').slice(-18);\n  const existing=document.getElementById(key);\n  if(existing)return Promise.resolve();\n  return new Promise(resolve=>{const l=document.createElement('link');l.id=key;l.rel='stylesheet';l.href=url;l.onload=()=>resolve();l.onerror=()=>resolve();document.head.appendChild(l);setTimeout(resolve,2500)})\n}"
          assert old in w, 'ensureFont block not found'
          w=w.replace(old,new,1)
          old="ensureFont(this.design.fontCssUrl);this.apply();this.render();this.start();"
          new="await ensureFont(this.design.fontCssUrl);if(document.fonts?.ready)try{await document.fonts.ready}catch{}this.apply();this.render();this.start();"
          assert old in w, 'init font marker not found'
          w=w.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          p2.write_text(h,encoding='utf-8')
          p3.write_text(w,encoding='utf-8')
      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/fix-fonts-full.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builder.js index.html widget.js
          git commit -m "Fix Geologica loading and add 100-900 weights"
          git push
