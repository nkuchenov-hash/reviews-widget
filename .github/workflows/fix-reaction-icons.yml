name: Fix reaction icons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore proper like icons
        shell: python
        run: |
          from pathlib import Path
          p=Path('widget.js')
          s=p.read_text(encoding='utf-8')
          css_old=".urw-reactions{display:flex;gap:12px;font-size:12px;color:var(--u-muted)}"
          css_new=".urw-reactions{display:flex;gap:14px;font-size:12px;color:var(--u-muted)}.urw-reaction{display:inline-flex;align-items:center;gap:4px}.urw-reaction svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}"
          assert css_old in s, 'reaction css not found'
          s=s.replace(css_old,css_new,1)
          old="${d.showReactions?`<div class=\"urw-reactions\"><span>♡ ${Number(r.likes)||''}</span><span>♧ ${Number(r.dislikes)||''}</span></div>`:'<span></span>'}"
          new="${d.showReactions?`<div class=\"urw-reactions\"><span class=\"urw-reaction\" aria-label=\"Нравится\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 10v10H4V10h3Zm0 9h10.2a2 2 0 0 0 1.94-1.52l1.5-6A2 2 0 0 0 18.7 9H14l.7-3.2A2.3 2.3 0 0 0 12.45 3L7 10Z\"/></svg>${Number(r.likes)||''}</span><span class=\"urw-reaction\" aria-label=\"Не нравится\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 14V4H4v10h3Zm0-9h10.2a2 2 0 0 1 1.94 1.52l1.5 6A2 2 0 0 1 18.7 15H14l.7 3.2A2.3 2.3 0 0 1 12.45 21L7 14Z\"/></svg>${Number(r.dislikes)||''}</span></div>`:'<span></span>'}"
          assert old in s, 'reaction markup not found'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/fix-reaction-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add widget.js
          git commit -m "Restore proper like and dislike icons"
          git push
