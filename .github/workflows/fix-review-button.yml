name: Fix review button
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch builder
        shell: python
        run: |
          from pathlib import Path
          p = Path('builder.js')
          s = p.read_text(encoding='utf-8')
          old = "const ETNIKA_YANDEX_URL='https://yandex.com/maps/org/studiya_avtoportreta_etnika/136853819595/reviews/';"
          new = "const ETNIKA_YANDEX_URL='https://yandex.ru/maps/org/studiya_avtoportreta_etnika/136853819595/reviews/';\nconst ETNIKA_REVIEW_URL=ETNIKA_YANDEX_URL+'?add-review=true';"
          assert old in s, 'ETNIKA url constant not found'
          s = s.replace(old, new, 1)
          old = "buttonUrl:ETNIKA_YANDEX_URL,showHeader:true"
          new = "buttonUrl:ETNIKA_REVIEW_URL,showHeader:true"
          assert old in s, 'default button url not found'
          s = s.replace(old, new, 1)
          marker = "function normalizeHex(v){let s=String(v||'').trim();if(!s.startsWith('#'))s='#'+s;if(/^#[0-9a-f]{3}$/i.test(s))s='#'+s.slice(1).split('').map(x=>x+x).join('');return /^#[0-9a-f]{6}$/i.test(s)?s.toUpperCase():null}"
          helper = marker + "\nfunction reviewFormUrl(businessUrl,businessId){try{let base=String(businessUrl||'').trim();if(!base)base=`https://yandex.ru/maps/org/-/${encodeURIComponent(businessId||'')}/reviews/`;const u=new URL(base);if(u.hostname==='yandex.com'||u.hostname==='www.yandex.com')u.hostname='yandex.ru';if(!/\\/reviews\\/?$/.test(u.pathname))u.pathname=u.pathname.replace(/\\/$/,'')+'/reviews/';u.searchParams.set('add-review','true');return u.toString()}catch{return `https://yandex.ru/maps/org/-/${encodeURIComponent(businessId||'')}/reviews/?add-review=true`}}"
          assert marker in s, 'normalizeHex marker not found'
          s = s.replace(marker, helper, 1)
          old = "data.source.businessUrl=data.source.businessUrl||ETNIKA_YANDEX_URL;await fetchSource();"
          new = "data.source.businessUrl=data.source.businessUrl||ETNIKA_YANDEX_URL;const savedButton=String(data.content?.buttonUrl||'');if(!savedButton||(/^https?:\\/\\/(?:www\\.)?yandex\\.(?:ru|com)\\/maps\\/org\\/.*\\/reviews\\/?$/i.test(savedButton)))data.content.buttonUrl=reviewFormUrl(data.source.businessUrl,data.source.businessId);await fetchSource();"
          assert old in s, 'load migration marker not found'
          s = s.replace(old, new, 1)
          old = "buttonUrl:$('buttonUrl').value,showHeader:true"
          new = "buttonUrl:$('buttonUrl').value.trim()||reviewFormUrl(data.source.businessUrl,data.source.businessId),showHeader:true"
          assert old in s, 'collect button marker not found'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/fix-review-button.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builder.js
          git commit -m "Fix direct Yandex review button"
          git push
