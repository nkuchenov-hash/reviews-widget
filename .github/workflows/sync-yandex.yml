name: Sync Yandex reviews
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    paths:
      - '.github/workflows/sync-yandex.yml'
      - 'scripts/sync_yandex.py'
permissions:
  contents: write
concurrency:
  group: sync-yandex-reviews
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Yandex reviews
        run: python scripts/sync_yandex.py
      - name: Commit updated reviews
        run: |
          if git diff --quiet -- data/reviews.json; then
            echo "No review changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews.json
          git commit -m "Update Yandex reviews"
          git push
