name: Sync client reviews
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    paths:
      - '.github/workflows/sync-yandex.yml'
      - 'scripts/sync_yandex.py'
      - 'scripts/sync_projects.py'
      - 'projects/*.json'
permissions:
  contents: write
concurrency:
  group: sync-client-reviews
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch reviews for active projects
        run: python scripts/sync_projects.py
      - name: Commit updated project reviews
        run: |
          if [ -z "$(git status --porcelain -- data/projects)" ]; then
            echo "No review changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects
          git commit -m "Update client reviews"
          git push
