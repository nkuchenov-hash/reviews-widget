<!-- ETNIKA B-REV · keep the independent Yandex reviews widget, use the same editorial heading as the site -->
<style id="etnika-reviews-section-style">
@import url('https://fonts.googleapis.com/css2?family=Forum&family=Geologica:wght@200;300;400;500&display=swap');
#etnika-reviews{
  box-sizing:border-box;
  min-height:100svh;
  display:flex;
  align-items:center;
  padding:clamp(48px,6vh,88px) max(80px,calc((100vw - 1760px)/2));
  background:#f5f3f2;
  color:#0a0a0a;
  font-family:'Geologica',Arial,sans-serif;
}
#etnika-reviews .etnika-reviews-inner{width:100%;max-width:1440px;margin:0 auto;min-width:0}
#etnika-reviews .etnika-reviews-overline{
  display:grid;
  grid-template-columns:auto minmax(80px,1fr) auto 1px auto minmax(80px,1fr);
  gap:clamp(12px,1vw,20px);
  align-items:center;
  margin-bottom:clamp(24px,3.6vh,46px);
  font-size:16px;
  font-weight:200;
  line-height:1.2;
  letter-spacing:.13em;
  text-transform:uppercase;
  white-space:nowrap;
}
#etnika-reviews .etnika-reviews-rule{height:1px;background:rgba(10,10,10,.16)}
#etnika-reviews .etnika-reviews-divider{width:1px;height:28px;background:rgba(10,10,10,.16)}
#etnika-reviews .etnika-reviews-overline-accent{color:#981018}
#etnika-reviews .etnika-reviews-heading{
  margin:0 0 clamp(22px,3vh,38px);
  font-family:'Forum',Georgia,serif;
  font-size:clamp(54px,5.4vw,96px);
  font-weight:400;
  line-height:.84;
  letter-spacing:-.045em;
  text-transform:uppercase;
}
#etnika-reviews .etnika-reviews-heading span{color:#981018}
#etnika-reviews .etnika-reviews-mount{width:100%;min-width:0}
#etnika-reviews .urw-title,
#etnika-reviews .urw-kicker{display:none!important}
#etnika-reviews .urw-head{align-items:center}
@media(max-width:1100px){
  #etnika-reviews .etnika-reviews-overline{
    grid-template-columns:auto minmax(25px,1fr) auto;
    gap:12px;
  }
  #etnika-reviews .etnika-reviews-divider,
  #etnika-reviews .etnika-reviews-overline-context,
  #etnika-reviews .etnika-reviews-rule-extra{display:none}
}
@media(max-width:800px){
  #etnika-reviews{padding:48px 20px;min-height:100svh}
  #etnika-reviews .etnika-reviews-heading{
    font-size:clamp(42px,11.8vw,68px);
    line-height:.88;
  }
  #etnika-reviews .etnika-reviews-heading span{display:block}
  #etnika-reviews .etnika-reviews-overline{margin-bottom:24px}
}
</style>
<section id="etnika-reviews" aria-label="Отзывы наших клиентов">
  <div class="etnika-reviews-inner">
    <div class="etnika-reviews-overline" aria-label="ЭТНИКА — отзывы с Яндекс Карт">
      <span>ЭТНИКА</span>
      <span class="etnika-reviews-rule" aria-hidden="true"></span>
      <span class="etnika-reviews-overline-accent">Отзывы</span>
      <span class="etnika-reviews-divider" aria-hidden="true"></span>
      <span class="etnika-reviews-overline-context">Яндекс Карты</span>
      <span class="etnika-reviews-rule etnika-reviews-rule-extra" aria-hidden="true"></span>
    </div>
    <h2 class="etnika-reviews-heading">Отзывы <span>наших клиентов</span></h2>
    <div class="etnika-reviews-mount" data-reviews-project="etnika"></div>
  </div>
</section>
<script src="https://nkuchenov-hash.github.io/reviews-widget/embed.js" defer></script>
