<!-- ETNIKA shared editorial design system: loaded by Tilda and the main site -->

<style>
@import url('https://fonts.googleapis.com/css2?family=Forum&family=Geologica:wght@200;300;400;500&display=swap');

<!-- ETNIKA B-REV · shared editorial overline + independent Yandex widget -->
<style id="etnika-reviews-section-style">
/* Only block-specific layout belongs here. Editorial lines/labels are defined
   centrally in site/assets/etnika-editorial-overline.css. */
#etnika-reviews{
  --etnika-reviews-edge:var(--et-u-edge,max(80px,calc((100vw - 1760px)/2)));
  box-sizing:border-box;
  min-height:100svh;
  display:flex;
  align-items:stretch;
  padding:var(--et-u-top,clamp(48px,6vh,88px))
          var(--etnika-reviews-edge)
          var(--et-u-bottom,clamp(48px,6vh,88px));
  background:#f5f3f2;
  color:#0a0a0a;
  font-family:var(--etnika-font-ui,'Geologica',Arial,sans-serif);
}
#etnika-reviews .etnika-reviews-inner{
  display:flex;
  flex-direction:column;
  justify-content:center;
  width:100%;
  min-width:0;
  max-width:none;
  margin:0;
}
#etnika-reviews .etnika-editorial-top{margin-bottom:clamp(24px,3.6vh,46px)}
#etnika-reviews .etnika-reviews-heading{
  margin:0 0 clamp(22px,3vh,38px);
  font-family:var(--etnika-font-display,'Forum',Georgia,serif);
  font-size:clamp(54px,4.9vw,90px);
  font-weight:400;
  line-height:.84;
  letter-spacing:-.045em;
  text-transform:uppercase;
}
#etnika-reviews .etnika-reviews-heading span{color:#981018}
#etnika-reviews .etnika-reviews-mount{width:100%;min-width:0}
#etnika-reviews .urw-title,
#etnika-reviews .urw-kicker{display:none!important}
#etnika-reviews .urw-head{align-items:center}
@media(max-width:1100px){
  #etnika-reviews{--etnika-reviews-edge:var(--et-u-edge,30px)}
}
@media(max-width:700px){
  #etnika-reviews{--etnika-reviews-edge:var(--et-u-edge,20px)}
  #etnika-reviews .etnika-reviews-heading{
    font-size:clamp(42px,11.8vw,68px);
    line-height:.88;
  }
  #etnika-reviews .etnika-reviews-heading span{display:block}
  #etnika-reviews .etnika-editorial-top{margin-bottom:24px}
}
</style>
<section id="etnika-reviews" aria-label="Отзывы наших клиентов">
  <div class="etnika-reviews-inner">
    <div class="etnika-reviews-overline etnika-editorial-top" aria-label="ЭТНИКА — отзывы с Яндекс Карт">
      <span>ЭТНИКА</span>
      <span class="etnika-reviews-rule" aria-hidden="true"></span>
      <span class="etnika-reviews-overline-accent">Отзывы</span>
      <span class="etnika-reviews-divider" aria-hidden="true"></span>
      <span class="etnika-reviews-overline-context">Яндекс Карты</span>
      <span class="etnika-reviews-rule etnika-reviews-rule-extra" aria-hidden="true"></span>
    </div>
    <h2 class="etnika-reviews-heading">Отзывы <span>наших клиентов</span></h2>
    <div class="etnika-reviews-mount" data-reviews-project="etnika"></div>
  </div>
</section>
<script src="https://nkuchenov-hash.github.io/reviews-widget/embed.js" defer></script>
