<!-- ETNIKA B-REV · shared editorial overline + independent Yandex widget -->
<style id="etnika-reviews-section-style">
/* Only block-specific layout belongs here. Editorial lines/labels are defined
   centrally in site/assets/etnika-editorial-overline.css. */
#etnika-reviews{
  --etnika-reviews-edge:var(--et-u-edge,max(80px,calc((100vw - 1760px)/2)));
  box-sizing:border-box;
  min-height:100svh;
  display:flex;
  align-items:stretch;
  padding:var(--et-u-top,clamp(48px,6vh,88px))
          var(--etnika-reviews-edge)
          var(--et-u-bottom,clamp(48px,6vh,88px));
  background:#f5f3f2;
  color:#0a0a0a;
  font-family:var(--etnika-font-ui,'Geologica',Arial,sans-serif);
}
#etnika-reviews .etnika-reviews-inner{
  display:flex;
  flex-direction:column;
  justify-content:center;
  width:100%;
  min-width:0;
  max-width:none;
  margin:0;
}
#etnika-reviews .etnika-editorial-top{margin-bottom:clamp(24px,3.6vh,46px)}
#etnika-reviews .etnika-reviews-heading{
  margin:0 0 clamp(22px,3vh,38px);
  font-family:var(--etnika-font-display,'Forum',Georgia,serif);
  font-size:clamp(54px,4.9vw,90px);
  font-weight:400;
  line-height:.84;
  letter-spacing:-.045em;
  text-transform:uppercase;
}
#etnika-reviews .etnika-reviews-heading span{color:#981018}
#etnika-reviews .etnika-reviews-mount{width:100%;min-width:0}
#etnika-reviews .urw-title,
#etnika-reviews .urw-kicker{display:none!important}
#etnika-reviews .urw-head{align-items:center}
/* The carousel and bottom rule must fill the SAME editorial grid as
   the upper overline and H2. The widget default maxWidth=1440px is narrower
   than ETNIKA's responsive --et-u-edge content field on larger viewports. */
#etnika-reviews .etnika-reviews-mount,
#etnika-reviews .urw-shell,
#etnika-reviews .urw-viewport,
#etnika-reviews .urw-controls{
  box-sizing:border-box;
  width:100%;
  min-width:0;
  max-width:none;
}
#etnika-reviews .urw-shell{
  margin-left:0;
  margin-right:0;
}
/* Reviews controls: editorial, square-corner hover feedback. */
#etnika-reviews .urw-btn,
#etnika-reviews .urw-arrow{
  transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease;
}
@media (hover:hover) and (pointer:fine){
  #etnika-reviews .urw-btn:hover{
    background:#0a0a0a;
    border-color:#0a0a0a;
    color:#fff;
    transform:translateY(-2px);
  }
  #etnika-reviews .urw-arrow:hover{
    background:#981018;
    border-color:#981018;
    color:#fff;
    transform:translateY(-2px);
  }
}
#etnika-reviews :is(.urw-btn,.urw-arrow):focus-visible{
  outline:2px solid #981018;
  outline-offset:3px;
}
@media (prefers-reduced-motion:reduce){
  #etnika-reviews :is(.urw-btn,.urw-arrow){transition:none;}
  #etnika-reviews :is(.urw-btn,.urw-arrow):hover{transform:none;}
}
/* Decorative rule shares the editorial overline's 1px grey stroke.
   Its end is aligned with the lower edge of the two carousel arrows. */
#etnika-reviews .urw-controls::before{
  content:"";
  display:block;
  flex:1 1 0;
  min-width:0;
  height:1px;
  align-self:flex-end;
  margin-right:clamp(12px,1.25vw,24px);
  background:var(--etnika-overline-line,rgba(10,10,10,.16));
}
@media(max-width:1100px){
  #etnika-reviews{--etnika-reviews-edge:var(--et-u-edge,30px)}
}
@media(max-width:700px){
  #etnika-reviews{--etnika-reviews-edge:var(--et-u-edge,20px)}
  #etnika-reviews .etnika-reviews-heading{
    font-size:clamp(42px,11.8vw,68px);
    line-height:.88;
  }
  #etnika-reviews .etnika-reviews-heading span{display:block}
  #etnika-reviews .etnika-editorial-top{margin-bottom:24px}
}
</style>
<section id="etnika-reviews" aria-label="Отзывы наших клиентов">
  <div class="etnika-reviews-inner">
    <div class="etnika-reviews-overline etnika-editorial-top" aria-label="ЭТНИКА — отзывы с Яндекс Карт">
      <span>ЭТНИКА</span>
      <span class="etnika-reviews-rule" aria-hidden="true"></span>
      <span class="etnika-reviews-overline-accent">Отзывы</span>
      <span class="etnika-reviews-divider" aria-hidden="true"></span>
      <span class="etnika-reviews-overline-context">Яндекс Карты</span>
      <span class="etnika-reviews-rule etnika-reviews-rule-extra" aria-hidden="true"></span>
    </div>
    <h2 class="etnika-reviews-heading">Отзывы <span>наших клиентов</span></h2>
    <div class="etnika-reviews-mount" data-reviews-project="etnika"></div>
  </div>
</section>
<script src="https://nkuchenov-hash.github.io/reviews-widget/embed.js?v=20261112-carousel-stability" defer></script>
